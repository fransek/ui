name: "🚀 Release"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # Required for OIDC (npm trusted publishing)

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm build
        if: ${{ steps.release.outputs.release_created }}

      # Authenticates via OIDC trusted publishing — no NPM_TOKEN needed.
      # Provenance attestations are generated automatically (public repo + package).
      # Keep pnpm pinned to 10: OIDC publishing 404s on pnpm 11 (pnpm/pnpm#11513).
      - run: pnpm publish
        if: ${{ steps.release.outputs.release_created }}
